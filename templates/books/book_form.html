{% extends 'base.html' %}
{% block title %}{% if book %}编辑{% else %}新增{% endif %}图书{% endblock %}
{% block content %}
<h2>{% if book %}编辑{% else %}新增{% endif %}图书</h2>
{% if messages %}
  {% for m in messages %}
    <p class="error">{{ m }}</p>
  {% endfor %}
{% endif %}
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <label>书名：<input type="text" name="title" value="{{ book.title|default:'' }}" required></label><br>
  <label>作者：<input type="text" name="author" value="{{ book.author|default:'' }}"></label><br>
  <label>ISBN：<input type="text" name="isbn" value="{{ book.isbn|default:'' }}" placeholder="留空自动生成"></label><br>
  <label>分类：
    <select name="category" required>
      <option value="">-- 请选择 --</option>
      {% for c in categories %}
        <option value="{{ c.pk }}"{% if book and book.category_id == c.pk %} selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </label><br>
  <label>总册数：<input type="number" name="total" value="{{ book.total|default:1 }}" min="1"></label><br>
  <button type="submit">保存</button>
</form>
<a href="{% url 'books:book_list' %}">返回列表</a>
{% endblock %}
