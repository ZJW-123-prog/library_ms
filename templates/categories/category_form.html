{% extends 'base.html' %}
{% block title %}新增分类{% endblock %}
{% block content %}
<div class="card shadow-lg border-0 rounded-lg mt-5">
  <div class="card-header bg-primary text-white">
    <h3 class="text-center font-weight-light my-4">
      <i class="fa fa-tags"></i> 新增分类
    </h3>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label for="name" class="form-label h6">名称</label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white">
            <i class="fa fa-tag"></i>
          </span>
          <input type="text" name="name" id="name" class="form-control form-control-lg" 
                 placeholder="请输入分类名称" required>
        </div>
      </div>
      <div class="mb-4">
        <label for="description" class="form-label h6">描述</label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white">
            <i class="fa fa-file-text-o"></i>
          </span>
          <textarea name="description" id="description" rows="4" class="form-control form-control-lg" 
                    placeholder="请输入分类描述"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary btn-lg">
          <i class="fa fa-save"></i> 保存
        </button>
        <a href="{% url 'categories:category_list' %}" class="btn btn-secondary btn-lg">
          <i class="fa fa-arrow-left"></i> 返回列表
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
