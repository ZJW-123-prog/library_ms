{% extends 'base.html' %}
{% block title %}分类管理{% endblock %}
{% block content %}
<div class="card shadow-lg border-0 rounded-lg mt-5">
  <div class="card-header bg-primary text-white">
    <div class="d-flex justify-content-between align-items-center">
      <h3 class="text-center font-weight-light my-4">
        <i class="fa fa-tags"></i> 分类列表
      </h3>
      <a href="{% url 'categories:category_add' %}" class="btn btn-light btn-sm">
        <i class="fa fa-plus"></i> 新增分类
      </a>
    </div>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="bg-primary text-white">
          <tr>
            <th>ID</th>
            <th>名称</th>
            <th>描述</th>
          </tr>
        </thead>
        <tbody>
        {% for c in categories %}
          <tr>
            <td>{{ c.id }}</td>
            <td>
              <i class="fa fa-tag text-primary me-2"></i>
              {{ c.name }}
            </td>
            <td>{{ c.description|linebreaksbr }}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
    {% if not categories %}
      <div class="text-center py-5">
        <i class="fa fa-tags text-primary" style="font-size: 3rem;"></i>
        <p class="text-muted mt-3">暂无分类数据</p>
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
