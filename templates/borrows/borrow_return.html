{% extends 'base.html' %}
{% block title %}直接还书{% endblock %}
{% block content %}
<div class="card shadow-lg border-0 rounded-lg mt-5">
  <div class="card-header bg-primary text-white">
    <h3 class="text-center font-weight-light my-4">
      <i class="fa fa-arrow-right"></i> 直接还书
    </h3>
  </div>
  <div class="card-body">
    <h5 class="card-title text-primary mb-4">
      <i class="fa fa-exchange"></i> 还书信息
    </h5>
    
    <div class="bg-light p-4 rounded-lg mb-5">
      <div class="mb-2">
        <strong class="text-primary">用户：</strong>
        <i class="fa fa-user-circle text-primary me-1"></i>{{ record.user.username }}
      </div>
      <div class="mb-2">
        <strong class="text-primary">图书：</strong>
        <i class="fa fa-book text-primary me-1"></i>《{{ record.book.title }}》
      </div>
      <div>
        <strong class="text-primary">借出日期：</strong>{{ record.borrow_date|date:'Y-m-d' }}
      </div>
    </div>
    
    <div class="alert alert-info">
      <i class="fa fa-info-circle"></i> 管理员确认直接还书
    </div>
    
    <form method="post">
      {% csrf_token %}
      <div class="d-flex justify-content-between">
        <a href="{% url 'borrows:borrow_list' %}" class="btn btn-secondary btn-lg">
          <i class="fa fa-times"></i> 取消
        </a>
        <button type="submit" class="btn btn-success btn-lg">
          <i class="fa fa-check"></i> 确认还书
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
