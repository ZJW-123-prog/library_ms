{% extends 'base.html' %}
{% block title %}编辑用户 - {{ user.username }}{% endblock %}
{% block content %}
<h2>编辑用户</h2>

<!-- 显示消息 -->
{% if messages %}
  {% for message in messages %}
    <div class="{% if message.tags == 'error' %}error-message{% else %}success-message{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<!-- 编辑表单 -->
<form method="post" action="{% url 'admins:user_edit' user.id %}">
  {% csrf_token %}
  
  <div class="form-group">
    <label for="username">用户名 <span class="required">*</span></label>
    <input type="text" id="username" name="username" value="{{ user.username }}" required>
  </div>
  
  <div class="form-group">
    <label for="email">邮箱</label>
    <input type="email" id="email" name="email" value="{{ user.email }}">
  </div>
  
  <div class="form-group">
    <label for="phone">手机号</label>
    <input type="text" id="phone" name="phone" value="{{ user.phone|default:'' }}">
  </div>
  
  <div class="form-group">
    <label for="role">角色 <span class="required">*</span></label>
    <select id="role" name="role" required>
      {% for value, label in ROLE_CHOICES %}
        <option value="{{ value }}" {% if user.role == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  
  <div class="form-actions">
    <button type="submit" class="save-btn">保存更改</button>
    <a href="{% url 'admins:user_list' %}" class="cancel-btn">取消</a>
  </div>
</form>

<style>
/* 表单样式 */
.form-group {
  margin-bottom: 15px;
}
.form-group label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}
.form-group input,
.form-group select {
  width: 100%;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  box-sizing: border-box;
}
.required {
  color: red;
}
.form-actions {
  margin-top: 20px;
}
.save-btn {
  background-color: #4CAF50;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 10px;
}
.save-btn:hover {
  background-color: #45a049;
}
.cancel-btn {
  background-color: #f44336;
  color: white;
  padding: 10px 15px;
  text-decoration: none;
  border-radius: 4px;
}
.cancel-btn:hover {
  background-color: #da190b;
}
/* 消息样式 */
.error-message {
  background-color: #fdd;
  color: #c00;
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 4px;
}
.success-message {
  background-color: #dff0d8;
  color: #3c763d;
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 4px;
}
</style>
{% endblock %}
