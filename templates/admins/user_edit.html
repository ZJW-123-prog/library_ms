{% extends 'base.html' %}
{% block title %}编辑用户 - {{ user.username }}{% endblock %}
{% block content %}
<div class="card shadow-lg border-0 rounded-lg mt-5">
  <div class="card-header bg-primary text-white">
    <h3 class="text-center font-weight-light my-4">
      <i class="fa fa-user-edit"></i> 编辑用户 - {{ user.username }}
    </h3>
  </div>
  <div class="card-body">
    <!-- 显示消息 -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show mb-4" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <!-- 编辑表单 -->
    <form method="post" action="{% url 'admins:user_edit' user.id %}">
      {% csrf_token %}
      
      <div class="mb-4">
        <label for="username" class="form-label h6">用户名 <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white">
            <i class="fa fa-user"></i>
          </span>
          <input type="text" id="username" name="username" value="{{ user.username }}" 
                 class="form-control form-control-lg" required>
        </div>
      </div>
      
      <div class="mb-4">
        <label for="email" class="form-label h6">邮箱</label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white">
            <i class="fa fa-envelope"></i>
          </span>
          <input type="email" id="email" name="email" value="{{ user.email }}" 
                 class="form-control form-control-lg">
        </div>
      </div>
      
      <div class="mb-4">
        <label for="phone" class="form-label h6">手机号</label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white">
            <i class="fa fa-phone"></i>
          </span>
          <input type="text" id="phone" name="phone" value="{{ user.phone|default:'' }}" 
                 class="form-control form-control-lg">
        </div>
      </div>
      
      <div class="mb-4">
        <label for="role" class="form-label h6">角色 <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white">
            <i class="fa fa-shield-alt"></i>
          </span>
          <select id="role" name="role" required class="form-select form-select-lg">
            {% for value, label in ROLE_CHOICES %}
              <option value="{{ value }}" {% if user.role == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      
      <div class="d-flex justify-content-between">
        <a href="{% url 'admins:user_list' %}" class="btn btn-secondary btn-lg">
          <i class="fa fa-times"></i> 取消
        </a>
        <button type="submit" class="btn btn-primary btn-lg">
          <i class="fa fa-save"></i> 保存更改
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
