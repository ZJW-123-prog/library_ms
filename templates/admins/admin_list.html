{% extends 'base.html' %}
{% block title %}管理员列表{% endblock %}
{% block content %}
<h2>管理员列表</h2>
<table>
  <thead><tr><th>ID</th><th>账号</th><th>角色</th><th>创建时间</th></tr></thead>
  <tbody>
  {% for a in admins %}
    <tr><td>{{ a.id }}</td><td>{{ a.username }}</td><td>{{ a.get_role_display }}</td><td>{{ a.created_at }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
