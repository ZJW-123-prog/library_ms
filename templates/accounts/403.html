{% extends 'base.html' %}
{% block title %}权限不足 - 图书管理系统{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-header bg-danger text-white">
          <h2 class="text-center font-weight-light my-4">
            <i class="fa fa-exclamation-triangle"></i> 权限不足
          </h2>
        </div>
        <div class="card-body text-center">
          <div class="mb-5">
            <i class="fa fa-lock" style="font-size: 8rem; color: #dc3545;"></i>
          </div>
          <p class="lead text-muted mb-3">抱歉，您没有权限访问此页面。</p>
          <p class="text-gray mb-5">只有管理员才能访问此功能。</p>
          <div class="d-flex justify-content-center gap-4">
            <a href="javascript:history.back()" class="btn btn-primary btn-lg">
              <i class="fa fa-arrow-left"></i> 返回上一页
            </a>
            <a href="{% url 'accounts:login' %}" class="btn btn-success btn-lg">
              <i class="fa fa-sign-in"></i> 重新登录
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
